name: Using Environment Variables

on: push

jobs:
  demo:
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: development
      WAREHOUSE: dev_wh
      LOG_LEVEL: INFO

    steps:
      - name: Use Environment Variables
        run: |
          echo "Environment: $ENVIRONMENT"
          echo "Warehouse: $WAREHOUSE"
          echo "Log Level: $LOG_LEVEL"

      - name: Check if Production
        run: |
          if [ "$ENVIRONMENT" = "production" ]; then
            echo "🚨 PRODUCTION MODE"
          else
            echo "ℹ️ Development mode"
          fi

      - name: Build Connection String
        run: |
          CONNECTION="account=xy12345|warehouse=$WAREHOUSE|env=$ENVIRONMENT"
          echo "Would connect with: $CONNECTION"
